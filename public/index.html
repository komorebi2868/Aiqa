<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIQA · AI 答疑助手（演示模式）</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }
    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      padding: 24px 32px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; opacity: .85; font-size: 14px; }

    main {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #374151;
      border-bottom: 1px solid #eef0f4;
      padding-bottom: 8px;
    }

    #question {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
    }
    #question:focus { border-color: #6366f1; }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: #4f46e5;
      color: #fff;
      border: 0;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover:not(:disabled) { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    .hint { font-size: 12px; color: #9ca3af; }
    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    #answer {
      min-height: 80px;
      background: #f9fafb;
      border: 1px dashed #e5e7eb;
      border-radius: 8px;
      padding: 12px 14px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      color: #374151;
    }
    #answer.empty { color: #9ca3af; font-style: italic; text-align: center; padding-top: 28px; }

    .meta {
      margin-top: 10px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #6b7280;
    }
    .meta .tag {
      background: #eef2ff;
      color: #4338ca;
      padding: 2px 8px;
      border-radius: 10px;
    }

    ul.history {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 520px;
      overflow-y: auto;
    }
    ul.history li {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f3f7;
      cursor: pointer;
      transition: background .12s;
    }
    ul.history li:hover { background: #f5f7ff; }
    ul.history li:last-child { border-bottom: 0; }
    ul.history li .q {
      font-weight: 600;
      color: #111827;
      font-size: 14px;
      margin-bottom: 4px;
      word-break: break-all;
    }
    ul.history li .t {
      font-size: 11px;
      color: #9ca3af;
    }
    ul.history .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 20px 0;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 AIQA · AI 答疑助手</h1>
    <p>实验 7-1 演示版 · 纯 Node 原生 http · 零运行时依赖</p>
  </header>

  <main>
    <section class="card">
      <h2>提问</h2>
      <textarea id="question" data-testid="ask-input" placeholder="请输入你的问题……（当前为演示模式，仅返回模拟回答）"></textarea>
      <div class="actions">
        <button id="askBtn" data-testid="ask-button">提交问题</button>
        <span class="hint">按 Ctrl/Cmd + Enter 快捷提交</span>
      </div>
      <div class="error" id="errBox"></div>

      <h2 style="margin-top: 20px;">回答</h2>
      <div id="answer" data-testid="answer-panel" data-testid="answer-text" class="empty">暂无回答，先提一个问题试试吧！</div>
      <div class="meta" id="meta" data-testid="answer-meta" style="display:none;"></div>
    </section>

    <aside class="card">
      <h2>历史提问</h2>
      <ul class="history" id="history" data-testid="history-list">
        <li class="empty" data-testid="history-item">暂无历史记录</li>
      </ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
